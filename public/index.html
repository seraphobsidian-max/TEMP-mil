<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK SINZU BATANG NORTHSIDE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #030712;
      background-image: 
        radial-gradient(at 50% 0%, rgba(255, 0, 85, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 0, 85, 0.2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 0, 85, 0.1);
      text-align: center;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .signal-box {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #ff0055;
    }

    .title {
      color: #ff0055;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .verified-icon {
      background: #3b82f6;
      color: #fff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .sub-title {
      color: #ff0055;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 8px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-mode {
      padding: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e293b;
      color: #64748b;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-mode.active {
      border-color: #3b82f6;
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
    }

    .input-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .email-input {
      flex: 1;
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid rgba(255, 0, 85, 0.4);
      border-radius: 8px;
      padding: 12px;
      color: #ff0055;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .btn-generate {
      background: transparent;
      border: 1px solid #ff0055;
      color: #ff0055;
      padding: 0 16px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-generate:hover {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #ff0055;
      color: #ff0055;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 0, 85, 0.15);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    .section-title {
      color: #ff0055;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-align: left;
      margin-bottom: 10px;
    }

    .inbox-container {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 20px;
      text-align: left;
    }

    .msg-card {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px 0;
      font-size: 11px;
    }

    .msg-sender {
      color: #3b82f6;
      font-weight: bold;
    }

    .msg-subject {
      color: #fff;
      margin-top: 2px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid #1e293b;
      padding: 10px 12px;
      border-radius: 8px;
      color: #ff0055;
      font-size: 12px;
      font-weight: 600;
    }

    .footer-credit {
      margin-top: 25px;
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .footer-credit span {
      color: #ff0055;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="status-bar">
    <div class="signal-box">
      <span>📶</span>
      <span>5G ONLINE</span>
    </div>
    <div id="liveTime">00:00:00 AM</div>
  </div>

  <div class="title">
    GK SINZU BATANG NORTHSIDE 
    <span class="verified-icon">✓</span>
  </div>
  <div class="sub-title">TEMP MAIL GENERATOR</div>

  <div class="mode-buttons">
    <button class="btn-mode active" id="randomBtn" onclick="setMode('random')">RANDOM</button>
    <button class="btn-mode" id="customBtn" onclick="setMode('custom')">CUSTOM</button>
  </div>

  <div class="input-container">
    <input type="text" id="emailDisplay" class="email-input" placeholder="Click Generate..." readonly>
    <button class="btn-generate" onclick="generateEmail()">GENERATE</button>
  </div>

  <div class="action-grid">
    <button class="btn-action" onclick="copyEmail()">COPY</button>
    <button class="btn-action" onclick="checkInbox()">CHECK</button>
  </div>

  <div class="section-title">INBOX</div>
  <div class="inbox-container" id="inboxList">
    <div style="color: #475569; font-size: 12px; text-align: center;">EMPTY</div>
  </div>

  <div class="section-title">HISTORY</div>
  <div id="historyList" class="history-list"></div>

  <div class="footer-credit">
    Made with <span>♥</span> by <span>sinzu</span>
  </div>
</div>

<script>
  let mode = 'random';
  let currentUsername = '';
  let currentDomain = '1secmail.com';
  let history = [];

  function updateTime() {
    const now = new Date();
    document.getElementById('liveTime').innerText = now.toLocaleTimeString();
  }
  setInterval(updateTime, 1000);
  updateTime();

  function setMode(selectedMode) {
    mode = selectedMode;
    document.getElementById('randomBtn').classList.toggle('active', mode === 'random');
    document.getElementById('customBtn').classList.toggle('active', mode === 'custom');
    
    const input = document.getElementById('emailDisplay');
    if (mode === 'custom') {
      input.removeAttribute('readonly');
      input.value = '';
      input.placeholder = 'Type username...';
    } else {
      input.setAttribute('readonly', true);
      generateEmail();
    }
  }

  function generateEmail() {
    if (mode === 'random') {
      currentUsername = Math.random().toString(36).substring(2, 10);
    } else {
      const inputVal = document.getElementById('emailDisplay').value.trim();
      currentUsername = inputVal.split('@')[0] || 'user' + Math.floor(Math.random() * 1000);
    }

    const fullEmail = `${currentUsername}@${currentDomain}`;
    document.getElementById('emailDisplay').value = fullEmail;
    addToHistory(fullEmail);
    checkInbox();
  }

  // API Call para basahin ang totoong Inbox Messages
  async function checkInbox() {
    const inboxBox = document.getElementById('inboxList');
    if (!currentUsername) return;

    inboxBox.innerHTML = '<div style="color: #3b82f6; font-size: 12px; text-align: center;">Checking messages...</div>';

    try {
      const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${currentUsername}&domain=${currentDomain}`);
      const messages = await res.json();

      if (!messages || messages.length === 0) {
        inboxBox.innerHTML = '<div style="color: #475569; font-size: 12px; text-align: center;">EMPTY</div>';
        return;
      }

      inboxBox.innerHTML = messages.map(msg => `
        <div class="msg-card">
          <div class="msg-sender">From: ${msg.from}</div>
          <div class="msg-subject">${msg.subject}</div>
        </div>
      `).join('');
    } catch (err) {
      inboxBox.innerHTML = '<div style="color: #ff0055; font-size: 12px; text-align: center;">Failed to fetch messages.</div>';
    }
  }

  function addToHistory(email) {
    if (!history.includes(email)) {
      history.unshift(email);
      if (history.length > 5) history.pop();
      renderHistory();
    }
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = history.map(item => `
      <div class="history-item">
        <span>${item}</span>
        <div style="cursor:pointer;" onclick="copySpecific('${item}')">📋</div>
      </div>
    `).join('');
  }

  function copyEmail() {
    const email = document.getElementById('emailDisplay').value;
    if (email) {
      navigator.clipboard.writeText(email);
      alert('Copied: ' + email);
    }
  }

  function copySpecific(text) {
    navigator.clipboard.writeText(text);
    alert('Copied: ' + text);
  }

  generateEmail();
</script>

</body>
  </html>
