<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMAIL GENERATOR - NEO</title>
  <style>
    body {
      background-color: #0b0d17;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    .avatar-wrapper {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid #ff0055;
      box-shadow: 0 0 15px #ff0055;
      object-fit: cover;
      background-color: #111827;
    }
    .upload-hint {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #ff0055;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 5px #000;
    }
    .title {
      color: #3b82f6;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: 15px;
    }
    .sub-title {
      color: #ff0055;
      font-size: 14px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .mode-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-mode {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid #1e293b;
      color: #aaa;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-mode.active {
      border-color: #3b82f6;
      color: #3b82f6;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .email-input {
      flex: 1;
      background: #111827;
      border: 1px solid #ff0055;
      border-radius: 6px;
      padding: 12px;
      color: #ff0055;
      font-weight: bold;
    }
    .btn-action {
      background: transparent;
      border: 1px solid #ff0055;
      color: #ff0055;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }
    .history-box {
      text-align: left;
      background: #111827;
      border-radius: 8px;
      padding: 15px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      color: #ff0055;
      padding: 8px 0;
      border-bottom: 1px solid #1f2937;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Interactive PFP Section -->
  <div class="avatar-wrapper" onclick="document.getElementById('pfpInput').click()">
    <img id="avatarImg" src="https://via.placeholder.com/110/111827/ff0055?text=PFP" alt="Avatar" class="avatar">
    <div class="upload-hint">📷</div>
  </div>
  <!-- Hidden File Input -->
  <input type="file" id="pfpInput" accept="image/*" style="display: none;" onchange="uploadPFP(event)">

  <div class="title">GK SINZU BATANG NORTHSIDE <span style="color:#3b82f6;">✔</span></div>
  <div class="sub-title">GMAIL GENERATOR</div>

  <!-- Mode Selector -->
  <div class="mode-buttons">
    <button class="btn-mode active" id="randomBtn" onclick="setMode('random')">RANDOM</button>
    <button class="btn-mode" id="customBtn" onclick="setMode('custom')">CUSTOM</button>
  </div>

  <!-- Generator Output Field -->
  <div class="input-group">
    <input type="text" id="emailDisplay" class="email-input" placeholder="Click Generate..." readonly>
    <button class="btn-action" onclick="generateEmail()">GENERATE</button>
  </div>

  <!-- Control Buttons -->
  <div class="action-grid">
    <button class="btn-action" onclick="copyEmail()">COPY</button>
    <button class="btn-action" onclick="checkInbox()">CHECK</button>
  </div>

  <!-- History Section -->
  <div class="history-box">
    <div style="color: #ff0055; font-size: 12px; font-weight: bold; margin-bottom: 10px;">HISTORY</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
  let mode = 'random';
  const DOMAIN = "@gmail.com";
  let history = [];

  // 1. I-check kung may nakasave nang PFP sa Local Storage
  window.onload = function() {
    const savedPFP = localStorage.getItem('global_pfp_url');
    if (savedPFP) {
      document.getElementById('avatarImg').src = savedPFP;
    }
  };

  // 2. Upload Function gamit ang ImgBB API (Free Image Hosting)
  async function uploadPFP(event) {
    const file = event.target.files[0];
    if (!file) return;

    const imgElement = document.getElementById('avatarImg');
    alert('Nag-u-upload ng profile picture, paki-hintay...');

    const formData = new FormData();
    formData.append('image', file);

    try {
      // Direct Upload sa ImgBB Public API
      const response = await fetch('https://api.imgbb.com/1/upload?key=6d207e02198a847aa98d0a2a901485a5', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      if (data.success) {
        const publicUrl = data.data.url;
        imgElement.src = publicUrl;
        
        // I-save ang URL para sa browser session
        localStorage.setItem('global_pfp_url', publicUrl);
        alert('Na-upload na ang bagong PFP! Makikita na ito ng lahat.');
      } else {
        alert('Failed to upload image. Paki-subukan ulit.');
      }
    } catch (err) {
      alert('Error in uploading: ' + err.message);
    }
  }

  function setMode(selectedMode) {
    mode = selectedMode;
    document.getElementById('randomBtn').classList.toggle('active', mode === 'random');
    document.getElementById('customBtn').classList.toggle('active', mode === 'custom');
    
    const input = document.getElementById('emailDisplay');
    if (mode === 'custom') {
      input.removeAttribute('readonly');
      input.value = '';
      input.placeholder = 'Type custom username...';
    } else {
      input.setAttribute('readonly', true);
      generateEmail();
    }
  }

  function generateEmail() {
    let username = '';
    
    if (mode === 'random') {
      username = Math.random().toString(36).substring(2, 10);
    } else {
      const inputVal = document.getElementById('emailDisplay').value.trim();
      username = inputVal.split('@')[0] || 'user' + Math.floor(Math.random() * 1000);
    }

    const fullEmail = `${username}${DOMAIN}`;
    document.getElementById('emailDisplay').value = fullEmail;
    addToHistory(fullEmail);
  }

  function addToHistory(email) {
    if (!history.includes(email)) {
      history.unshift(email);
      if (history.length > 5) history.pop();
      renderHistory();
    }
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = history.map(item => `
      <div class="history-item">
        <span>${item}</span>
        <div>
          <span style="cursor:pointer; margin-right:8px;" onclick="copySpecific('${item}')">🔄</span>
          <span style="cursor:pointer;" onclick="deleteHistory('${item}')">🗑️</span>
        </div>
      </div>
    `).join('');
  }

  function copyEmail() {
    const email = document.getElementById('emailDisplay').value;
    if (email) {
      navigator.clipboard.writeText(email);
      alert('Copied to clipboard: ' + email);
    }
  }

  function copySpecific(text) {
    navigator.clipboard.writeText(text);
    alert('Copied: ' + text);
  }

  function deleteHistory(email) {
    history = history.filter(item => item !== email);
    renderHistory();
  }

  function checkInbox() {
    alert('Checking inbox for generated Gmail...');
  }

  generateEmail();
</script>

</body>
        </html>
