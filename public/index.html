<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sinzu | 𝚃𝙴𝙼𝙿 𝙼𝙰𝙸𝙻</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --accent: #1b7bff;
            --gold: #ff2e5b;
            --blue: #2d9dff;
            --bg: #030812;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(27, 123, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: #fff; overflow-x: hidden; padding-bottom: 30px; }

        .hero { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .cover-area {
            width: 100%; height: 130px;
            background: linear-gradient(to bottom, transparent, var(--bg)),
                        radial-gradient(circle at 50% 30%, rgba(27,123,255,0.35), transparent 70%),
                        #04101f;
            background-size: cover; background-position: center;
            border-bottom: 2px solid var(--accent);
        }

        .profile-container { margin-top: -45px; text-align: center; z-index: 10; margin-bottom: 15px; }

        .profile-hex {
            width: 85px; height: 85px; padding: 3px; background: var(--bg);
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(27, 123, 255, 0.5); border: 2px solid var(--gold);
            position: relative; overflow: hidden;
            animation: avatarPulse 2.4s ease-in-out infinite;
        }
        .profile-hex svg { width: 100%; height: 100%; }
        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(27,123,255,0.5), 0 0 0 rgba(255,46,91,0); }
            50% { box-shadow: 0 0 28px rgba(27,123,255,0.9), 0 0 14px rgba(255,46,91,0.6); }
        }
        .eye-glow { animation: eyeFlicker 1.8s ease-in-out infinite; transform-origin: center; }
        @keyframes eyeFlicker {
            0%, 100% { opacity: 0.75; }
            45% { opacity: 1; filter: drop-shadow(0 0 4px #ff2e5b); }
            50% { opacity: 0.35; }
            55% { opacity: 1; filter: drop-shadow(0 0 6px #ff2e5b); }
        }
        .hair-drift { animation: hairSway 4s ease-in-out infinite; transform-origin: 50px 30px; }
        @keyframes hairSway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(0.6deg); }
        }

        .name-wrapper {
            margin-top: 5px; color: var(--gold); display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }

        .wave-text {
            display: flex; flex-wrap: wrap; justify-content: center; font-family: 'Syncopate', sans-serif;
            font-weight: 700; font-size: 0.72rem; letter-spacing: 1.5px; max-width: 320px;
        }

        .wave-text span {
            display: inline-block;
            animation: waveAnim 2s infinite ease-in-out;
            animation-delay: calc(0.08s * var(--i));
        }
        .wave-text span.space { width: 6px; }

        @keyframes waveAnim {
            0%, 40%, 100% { transform: translateY(0); }
            20% { transform: translateY(-6px); color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        }

        .verified-badge { color: var(--blue); font-size: 0.9rem; }

        section { padding: 0 4%; max-width: 450px; margin: 0 auto; width: 100%; }

        .section-header {
            font-family: 'Syncopate', sans-serif; font-size: 0.6rem; font-weight: 700;
            color: var(--gold); margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; margin-top: 10px;
        }
        .section-header::after { content: ""; height: 1px; flex-grow: 1; background: linear-gradient(to right, var(--gold), transparent); opacity: 0.2; }

        .card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 10px; padding: 12px; margin-bottom: 12px;
        }

        .mode-selector { display: flex; gap: 6px; margin-bottom: 12px; }
        .mode-btn {
            flex: 1; padding: 8px; text-align: center; cursor: pointer; border-radius: 6px;
            font-size: 0.55rem; font-family: 'Syncopate'; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1); color: #888; transition: 0.3s;
        }
        .mode-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(27, 123, 255, 0.08); }

        .input-container { display: flex; gap: 6px; width: 100%; align-items: center; }
        .form-input {
            flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.05);
            padding: 10px; border-radius: 6px; color: var(--gold); font-size: 0.7rem; outline: none;
            min-width: 0;
        }

        .btn-execute {
            padding: 10px 10px; border-radius: 6px; border: 1px solid var(--gold);
            background: transparent; color: var(--gold); font-family: 'Syncopate', sans-serif;
            font-size: 0.45rem; font-weight: 700; cursor: pointer; text-transform: uppercase;
            white-space: nowrap;
        }

        .msg-item {
            background: rgba(27, 123, 255, 0.05); border: 1px solid rgba(27, 123, 255, 0.15);
            padding: 12px; border-radius: 8px; margin-top: 8px; border-left: 3px solid var(--accent);
        }
        .msg-header { display: flex; justify-content: space-between; font-size: 0.5rem; font-family: 'Syncopate'; color: #888; margin-bottom: 6px; }
        .code-box {
            background: rgba(0,0,0,0.5); border: 1px dashed var(--accent);
            padding: 10px; border-radius: 6px; text-align: center;
            font-size: 0.9rem; font-weight: 700; color: var(--accent);
            display: flex; justify-content: space-between; align-items: center;
        }

        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .history-actions { display: flex; gap: 10px; align-items: center; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #fff; padding: 10px 15px;
            border-radius: 4px; font-family: 'Syncopate'; font-size: 0.5rem; z-index: 1000; display: none;
        }
        .spinner { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--gold); border-radius: 50%; width: 10px; height: 10px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body onclick="playMusic()">

    <audio id="bgMusic" loop>
        <source src="kurapika.mp3" type="audio/mpeg">
    </audio>

    <header class="hero">
        <div class="cover-area"></div>
        <div class="profile-container">
            <div class="profile-hex">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
                            <stop offset="0%" stop-color="#0f3a63"/>
                            <stop offset="100%" stop-color="#020810"/>
                        </radialGradient>
                        <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#0c1826"/>
                            <stop offset="100%" stop-color="#050b12"/>
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>

                    <!-- coat/shoulders -->
                    <path d="M10 100 C18 70 30 62 50 60 C70 62 82 70 90 100 Z" fill="url(#coatGrad)"/>

                    <!-- neck/collar -->
                    <path d="M40 58 L60 58 L58 68 L42 68 Z" fill="#1a2a3a"/>

                    <!-- hair back -->
                    <path class="hair-drift" d="M28 32 C24 20 34 6 50 6 C66 6 76 20 72 32 C74 40 70 46 66 42 C68 34 60 22 50 22 C40 22 32 34 34 42 C30 46 26 40 28 32 Z"
                          fill="#0a0a12"/>

                    <!-- face -->
                    <path d="M36 30 C36 44 42 54 50 54 C58 54 64 44 64 30 C64 20 58 14 50 14 C42 14 36 20 36 30 Z"
                          fill="#5c6b78"/>

                    <!-- hair curls front -->
                    <path class="hair-drift" d="M34 26 C30 22 30 14 38 12 C34 18 36 24 38 28 Z" fill="#0a0a12"/>
                    <path class="hair-drift" d="M66 26 C70 22 70 14 62 12 C66 18 64 24 62 28 Z" fill="#0a0a12"/>
                    <path d="M38 12 C42 4 58 4 62 12 C56 8 44 8 38 12 Z" fill="#0a0a12"/>

                    <!-- eyes -->
                    <ellipse class="eye-glow" cx="43" cy="32" rx="4.2" ry="3" fill="#ff2e5b"/>
                    <ellipse class="eye-glow" cx="57" cy="32" rx="4.2" ry="3" fill="#ff2e5b"/>
                    <circle cx="43" cy="32" r="1" fill="#fff"/>
                    <circle cx="57" cy="32" r="1" fill="#fff"/>

                    <!-- brows -->
                    <path d="M39 27 L47 26" stroke="#1a1a22" stroke-width="1.2" stroke-linecap="round"/>
                    <path d="M61 27 L53 26" stroke="#1a1a22" stroke-width="1.2" stroke-linecap="round"/>

                    <!-- mouth -->
                    <path d="M46 44 Q50 46 54 44" stroke="#2a323a" stroke-width="1" fill="none"/>

                    <!-- tie -->
                    <path d="M47 60 L53 60 L52 72 L50 76 L48 72 Z" fill="#0a1420"/>
                </svg>
            </div>
            <div class="name-wrapper">
                <div class="wave-text" id="waveName"></div>
                <i class="fas fa-check-circle verified-badge"></i>
            </div>
        </div>
    </header>

    <section>
        <div class="section-header">GMAIL GENERATOR</div>
        <div class="card">
            <div class="mode-selector">
                <div class="mode-btn active" id="randomMode" onclick="setMode('random')">RANDOM</div>
                <div class="mode-btn" id="customMode" onclick="setMode('custom')">CUSTOM</div>
            </div>

            <div class="input-container">
                <input type="text" id="emailInput" class="form-input" placeholder="Click GENERATE..." readonly>
                <button class="btn-execute" id="actionBtn" onclick="handleAction()">GENERATE</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px;">
                <button class="btn-execute" onclick="copyEmail()">COPY</button>
                <button class="btn-execute" id="checkBtn" onclick="loadInbox()">CHECK</button>
            </div>
        </div>

        <div class="section-header">INBOX</div>
        <div id="inbox">
            <p style="text-align: center; font-size: 0.5rem; color: #444; font-family: 'Syncopate';">WAITING...</p>
        </div>

        <div class="section-header">HISTORY</div>
        <div id="historyList" class="card" style="padding: 10px; font-size: 0.6rem;"></div>
    </section>

    <div id="toast">SYSTEM READY</div>

    <script>
        const DOMAIN = "@timpmeyl.indevs.in";
        const API_URL = "https://temporary-emaill.netlify.app/api/messages?address=";

        let currentMode = 'random';
        let isMusicPlaying = false;

        function renderWaveName(text) {
            const el = document.getElementById('waveName');
            el.innerHTML = '';
            let i = 0;
            [...text].forEach(ch => {
                if (ch === ' ') {
                    const s = document.createElement('span');
                    s.className = 'space';
                    el.appendChild(s);
                } else {
                    const s = document.createElement('span');
                    s.style.setProperty('--i', i);
                    s.textContent = ch;
                    el.appendChild(s);
                    i++;
                }
            });
        }
        renderWaveName("GK SINZU BATANG NORTHSIDE");

        function playMusic() {
            const music = document.getElementById('bgMusic');
            if(!isMusicPlaying) {
                music.play().catch(() => {});
                isMusicPlaying = true;
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('randomMode').classList.toggle('active', mode === 'random');
            document.getElementById('customMode').classList.toggle('active', mode === 'custom');
            const input = document.getElementById('emailInput');
            input.value = "";
            input.readOnly = (mode === 'random');
            document.getElementById('actionBtn').innerText = (mode === 'random' ? "GENERATE" : "CREATE");
            if(mode === 'custom') input.focus();
        }

        function handleAction() {
            const input = document.getElementById('emailInput');
            const btn = document.getElementById('actionBtn');
            let val = input.value.trim().toLowerCase();
            if(currentMode === 'custom' && !val) { showToast("NAME_REQUIRED"); return; }

            btn.disabled = true;
            btn.innerHTML = `<div class="spinner"></div>`;

            setTimeout(() => {
                let fullMail = (currentMode === 'random')
                    ? Math.random().toString(36).substring(2, 10) + DOMAIN
                    : (val.includes('@') ? val.split('@')[0] : val) + DOMAIN;

                input.value = fullMail;
                saveHistory(fullMail);
                showToast("MAIL_READY");
                btn.disabled = false;
                btn.innerText = (currentMode === 'random' ? "GENERATE" : "CREATE");
                loadInbox();
            }, 500);
        }

        async function loadInbox() {
            const email = document.getElementById('emailInput').value;
            if(!email) return;
            const container = document.getElementById('inbox');
            container.innerHTML = '<p style="text-align:center; font-size:0.5rem; color:var(--gold);">SYNCING...</p>';

            try {
                const res = await fetch(API_URL + email + "&nocache=" + Date.now());
                const data = await res.json();
                if(!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; font-size:0.5rem; color:#444;">EMPTY</p>';
                } else {
                    container.innerHTML = data.map(msg => {
                        const code = (msg.subject || "").match(/\b\d{5,8}\b/);
                        return `
                            <div class="msg-item">
                                <div class="msg-header"><span>${msg.from.split('<')[0].replace(/"/g, '')}</span><span>${new Date(msg.date).toLocaleTimeString()}</span></div>
                                <div class="code-box"><span>${code ? code[0] : 'VIEW'}</span><i class="fas fa-copy" onclick="copyToClipboard('${code ? code[0] : msg.subject}')"></i></div>
                            </div>`;
                    }).join('');
                }
            } catch (e) { container.innerHTML = '<p style="color:red; text-align:center; font-size:0.5rem;">ERROR</p>'; }
        }

        function saveHistory(email) {
            let history = JSON.parse(localStorage.getItem('tempMailKurapika') || '[]');
            if(!history.includes(email)) {
                history.unshift(email);
                localStorage.setItem('tempMailKurapika', JSON.stringify(history.slice(0, 5)));
            }
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('tempMailKurapika') || '[]');
            const list = document.getElementById('historyList');
            if(!history.length) { list.innerHTML = '<p style="text-align:center; color:#444;">EMPTY</p>'; return; }
            list.innerHTML = history.map((h, i) => `
                <div class="history-item">
                    <span style="color:var(--gold); font-size:0.5rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70%;">${h}</span>
                    <div class="history-actions">
                        <i class="fas fa-sync" style="color:var(--blue);" onclick="useHistory('${h}')"></i>
                        <i class="fas fa-trash" style="color:var(--accent);" onclick="deleteHistory(${i})"></i>
                    </div>
                </div>`).join('');
        }

        function deleteHistory(index) {
            let history = JSON.parse(localStorage.getItem('tempMailKurapika') || '[]');
            history.splice(index, 1);
            localStorage.setItem('tempMailKurapika', JSON.stringify(history));
            renderHistory();
            showToast("DELETED");
        }

        function useHistory(email) {
            document.getElementById('emailInput').value = email;
            loadInbox();
            showToast("RESTORED");
        }

        function copyEmail() { const m = document.getElementById('emailInput').value; if(m) copyToClipboard(m); }
        function copyToClipboard(t) { navigator.clipboard.writeText(t); showToast("COPIED"); }
        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }
        window.onload = renderHistory;
    </script>
</body>
                                                       </html>
