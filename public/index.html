<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK SINZU BATANG NORTHSIDE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #030712;
      background-image: 
        radial-gradient(at 50% 0%, rgba(255, 0, 85, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 0, 85, 0.2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 0, 85, 0.1);
      text-align: center;
    }

    /* PFP Styles */
    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #ff0055;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
      object-fit: cover;
      background-color: #0f172a;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .avatar-wrapper:hover .avatar {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
    }

    .upload-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #ff0055;
      color: #fff;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 2px solid #0f172a;
    }

    /* Titles */
    .title {
      color: #ff0055;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .verified-icon {
      background: #3b82f6;
      color: #fff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .sub-title {
      color: #ff0055;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 10px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    /* Mode Buttons */
    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-mode {
      padding: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e293b;
      color: #64748b;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-mode.active {
      border-color: #3b82f6;
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
    }

    /* Input & Generate Box */
    .input-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .email-input {
      flex: 1;
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid rgba(255, 0, 85, 0.4);
      border-radius: 8px;
      padding: 12px;
      color: #ff0055;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .email-input::placeholder {
      color: #475569;
    }

    .btn-generate {
      background: transparent;
      border: 1px solid #ff0055;
      color: #ff0055;
      padding: 0 16px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-generate:hover {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
    }

    /* Action Grid (Copy & Check) */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #ff0055;
      color: #ff0055;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 0, 85, 0.15);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    /* History & Inbox Area */
    .section-title {
      color: #ff0055;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-align: left;
      margin-bottom: 10px;
    }

    .inbox-empty {
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid #1e293b;
      padding: 10px 12px;
      border-radius: 8px;
      color: #ff0055;
      font-size: 12px;
      font-weight: 600;
    }

    .history-actions {
      display: flex;
      gap: 10px;
      color: #3b82f6;
      cursor: pointer;
    }

    .history-actions span:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Profile Picture Section -->
  <div class="avatar-wrapper" onclick="document.getElementById('pfpInput').click()">
    <img id="avatarImg" src="https://i.ibb.co/L8vX4Xv/84e866b79b0e34cab9e64ec3ca5e0c36.jpg" alt="Profile" class="avatar">
    <div class="upload-badge">📷</div>
  </div>
  <input type="file" id="pfpInput" accept="image/*" style="display: none;" onchange="uploadPFP(event)">

  <!-- Title Section -->
  <div class="title">
    GK SINZU BATANG NORTHSIDE 
    <span class="verified-icon">✓</span>
  </div>
  <div class="sub-title">GMAIL GENERATOR</div>

  <!-- Mode Selector -->
  <div class="mode-buttons">
    <button class="btn-mode active" id="randomBtn" onclick="setMode('random')">RANDOM</button>
    <button class="btn-mode" id="customBtn" onclick="setMode('custom')">CUSTOM</button>
  </div>

  <!-- Email Input Box -->
  <div class="input-container">
    <input type="text" id="emailDisplay" class="email-input" placeholder="Click Generate..." readonly>
    <button class="btn-generate" onclick="generateEmail()">GENERATE</button>
  </div>

  <!-- Copy & Check Buttons -->
  <div class="action-grid">
    <button class="btn-action" onclick="copyEmail()">COPY</button>
    <button class="btn-action" onclick="checkInbox()">CHECK</button>
  </div>

  <!-- Inbox Status -->
  <div class="section-title">INBOX</div>
  <div class="inbox-empty">EMPTY</div>

  <!-- History List -->
  <div class="section-title">HISTORY</div>
  <div id="historyList" class="history-list"></div>
</div>

<script>
  let mode = 'random';
  const DOMAIN = "@gmail.com";
  let history = [];

  // Check saved profile picture URL on load
  window.onload = function() {
    const savedPFP = localStorage.getItem('global_pfp_url');
    if (savedPFP) {
      document.getElementById('avatarImg').src = savedPFP;
    }
  };

  // Profile Upload Logic (ImgBB API Integration)
  async function uploadPFP(event) {
    const file = event.target.files[0];
    if (!file) return;

    const imgElement = document.getElementById('avatarImg');
    alert('Uploading profile picture...');

    const formData = new FormData();
    formData.append('image', file);

    try {
      const response = await fetch('https://api.imgbb.com/1/upload?key=6d207e02198a847aa98d0a2a901485a5', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      if (data.success) {
        const publicUrl = data.data.url;
        imgElement.src = publicUrl;
        localStorage.setItem('global_pfp_url', publicUrl);
        alert('Profile picture updated successfully!');
      } else {
        alert('Upload failed. Please try again.');
      }
    } catch (err) {
      alert('Error uploading image: ' + err.message);
    }
  }

  // Toggle Random/Custom mode
  function setMode(selectedMode) {
    mode = selectedMode;
    document.getElementById('randomBtn').classList.toggle('active', mode === 'random');
    document.getElementById('customBtn').classList.toggle('active', mode === 'custom');
    
    const input = document.getElementById('emailDisplay');
    if (mode === 'custom') {
      input.removeAttribute('readonly');
      input.value = '';
      input.placeholder = 'Type username...';
    } else {
      input.setAttribute('readonly', true);
      generateEmail();
    }
  }

  // Generate Email Logic (@gmail.com)
  function generateEmail() {
    let username = '';
    
    if (mode === 'random') {
      username = Math.random().toString(36).substring(2, 10);
    } else {
      const inputVal = document.getElementById('emailDisplay').value.trim();
      username = inputVal.split('@')[0] || 'user' + Math.floor(Math.random() * 1000);
    }

    const fullEmail = `${username}${DOMAIN}`;
    document.getElementById('emailDisplay').value = fullEmail;
    addToHistory(fullEmail);
  }

  function addToHistory(email) {
    if (!history.includes(email)) {
      history.unshift(email);
      if (history.length > 5) history.pop();
      renderHistory();
    }
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = history.map(item => `
      <div class="history-item">
        <span>${item}</span>
        <div class="history-actions">
          <span onclick="copySpecific('${item}')">🔄</span>
          <span onclick="deleteHistory('${item}')">🗑️</span>
        </div>
      </div>
    `).join('');
  }

  function copyEmail() {
    const email = document.getElementById('emailDisplay').value;
    if (email) {
      navigator.clipboard.writeText(email);
      alert('Copied: ' + email);
    }
  }

  function copySpecific(text) {
    navigator.clipboard.writeText(text);
    alert('Copied: ' + text);
  }

  function deleteHistory(email) {
    history = history.filter(item => item !== email);
    renderHistory();
  }

  function checkInbox() {
    alert('Checking inbox...');
  }

  // Auto-generate on first launch
  generateEmail();
</script>

</body>
  </html>
